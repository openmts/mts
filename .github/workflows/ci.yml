name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: setup-goimports
        run: go install github.com/incu6us/goimports-reviser/v3@v3.12.6

      - name: fmt check
        run: goimports-reviser -project-name github.com/openmts/mts -recursive -list-diff -set-exit-status .

      - name: unit
        run: make unit

      - name: coverage
        run: make coverage

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: prepare embed
        run: make ensure-dashboard-embed

      - name: submit
        uses: actions/go-dependency-submission@v2

  vulncheck:
    name: Go vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  frontend-audit:
    name: Frontend audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit
        working-directory: cmd/mts-dashboard
        run: npm run audit:ci
