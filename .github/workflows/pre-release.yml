name: Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prerelease-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: mts-server ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/mts-dashboard/package-lock.json

      - name: build dashboard
        run: |
          cd cmd/mts-dashboard
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: build mts-server
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          version="dev-${GITHUB_SHA:0:7}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/mts-server-${GOOS}-${GOARCH}${ext}" \
            ./cmd/mts-server

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mts-server-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  prerelease:
    name: Publish dev pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: checksums
        run: |
          cd dist
          sha256sum */* > checksums.txt
          cat checksums.txt

      - name: cleanup old dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes 2>/dev/null || true
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/dev" 2>/dev/null || true

      - name: create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA:0:7}"
          gh release create dev \
            dist/*/* dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "mts-server dev pre-release" \
            --notes "mts-server dev pre-release built from main commit ${short} (dashboard embedded)."

  docker:
    name: Push GHCR image (dev)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # GHCR_IMAGE computed via bash before build (ghcr.io requires lowercase repo name)
      GHCR_IMAGE: ""
      # image tag fixed to dev; overwritten on every main push
      IMAGE_TAG: dev
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: compute image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mts-server" >> "$GITHUB_ENV"

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: setup qemu
        uses: docker/setup-qemu-action@v3

      - name: login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
