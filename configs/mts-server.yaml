# mts-server 完整配置示例。
#
# 当前服务只启动单机本地 MTS Engine，不接入外部元数据系统，
# 不提供 SQL、InfluxQL、PromQL 或 MetricsQL parser。HTTP/gRPC 查询
# 均使用结构化 Query 请求体。

# data_dir 是 MTS 本地数据目录，包含 WAL、SSTable、manifest、metadata 等文件。
# 生产环境建议使用独立持久化目录，并由部署系统保证目录权限。
data_dir: ./data/mts-server

http:
  # enabled 控制是否启动 HTTP JSON API。
  enabled: true
  # addr 是 HTTP 监听地址。全零 [::] 同时监听 IPv4/IPv6 所有网卡；
  # 生产环境暴露到外网前应放在反向代理或网关后面。
  addr: "[::]:8086"
  # dashboard_base 为内置 Dashboard SPA 子路径；默认 /。若前端以 VITE_BASE=/mts/ 构建，这里需设为 /mts/。
  dashboard_base: /
  # tls.enabled 为 true 时使用 HTTPS；client_auth 为 true 时启用 mTLS。
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_ca_file: ""
    client_auth: false
  read_timeout: 30s
  read_header_timeout: 5s
  write_timeout: 30s
  idle_timeout: 2m

grpc:
  # enabled 控制是否启动 gRPC API。
  enabled: true
  # addr 是 gRPC 监听地址。全零 [::] 同时监听 IPv4/IPv6 所有网卡。
  addr: "[::]:9096"
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_ca_file: ""
    client_auth: false
  max_recv_msg_bytes: 16777216
  max_send_msg_bytes: 16777216

auth:
  # admin_token 保护管理面和用户权限面。空值表示开发兼容模式；生产环境应配置强随机值，
  # HTTP 使用 Authorization: Bearer <token> 或 X-MTS-Admin-Token，gRPC 使用同名 metadata。
  admin_token: ""
  # data_tokens 保护数据面。空数组表示兼容模式；生产环境建议配置并启用 require_user。
  data_tokens: []
  # require_user 为 true 时，数据面必须携带用户 Bearer token 并通过 DB 权限校验。
  # 服务不会创建默认管理员；首次部署应使用 admin_token 调用用户 API 创建管理员。
  require_user: false

user:
  # endpoint 指定用户模块接入地址。local 表示使用内置本地实现；缺省时同样使用 local。
  endpoint: local
  # password_auth_disabled 为 true 时关闭密码登录、token 校验和 token 撤销能力。
  password_auth_disabled: false

limits:
  max_request_body_bytes: 16777216
  max_write_points: 10000
  default_query_limit: 10000
  max_query_limit: 100000
  request_timeout: 30s
  max_concurrent_http: 1024
  max_concurrent_grpc: 1024

observability:
  access_log: true
  pprof:
    # pprof 端点位于 /debug/pprof/*，启用后仍要求 admin token。
    enabled: false

backup:
  # storage snapshot 默认写入该目录，目录权限 0700，快照文件权限 0600。
  dir: ./data/mts-server/backups

log:
  level: info
  format: text

engine:
  # database/retention_policy 为空时，写入和查询会使用这里的默认值。
  default_database: default
  default_retention_policy: autogen

  # shard_duration 控制按时间切分 shard 的窗口，使用 Go duration 格式，例如 30m、1h、24h。
  shard_duration: 1h
  # retention 为 0s 表示不按时间自动过期数据；设置为 168h 表示保留 7 天。
  retention: 0s

  # memtable_max_samples 控制内存表样本数阈值，超过后会触发刷写路径。
  memtable_max_samples: 10000
  # flush_sync 为 true 时刷写路径更偏向持久化安全，代价是写入延迟可能升高。
  flush_sync: false

  # max_concurrent_compaction 跨 shard 并行 compact 上限；0 使用引擎默认。
  max_concurrent_compaction: 0
  # max_concurrent_downsample 后台降采样并发上限；0 使用引擎默认。
  max_concurrent_downsample: 0
  # memtable_disorder_flush_ratio 乱序占比阈值；0 关闭。
  memtable_disorder_flush_ratio: 0
  # memtable_disorder_flush_min_samples 乱序降载最小样本数；0 使用引擎默认。
  memtable_disorder_flush_min_samples: 0

  compression:
    # enabled 控制 SSTable 数据页压缩。
    enabled: true
    # algorithm 支持 snappy、zstd 等已在引擎中支持的算法；空值表示使用默认行为。
    algorithm: snappy
    # min_page_values 控制达到多少值后才压缩数据页，用于避免小页压缩收益过低。
    min_page_values: 128
    # value_page_samples 控制 values 页样本数；更大通常提高压缩率。
    value_page_samples: 0
    # omit_write_seq 省略 per-sample writeSeq（POC 推荐 true 以提高压缩率）。
    omit_write_seq: false
    # zstd_level: fastest|default|better|best（algorithm=zstd 时生效）。
    zstd_level: default

  compaction:
    # enabled 控制后台/手动 compaction 能力。
    enabled: true
    # background_interval 为 0s 表示不启动周期性后台 compaction；例如 10m 表示每 10 分钟检查一次。
    background_interval: 0s
    # level0_part_limit 控制 Level 0 part 数量阈值。
    level0_part_limit: 4
    # max_cascade_steps 控制一次 compaction 级联推进的最大步数。
    max_cascade_steps: 8
    # max_concurrent 覆盖跨 shard 并行 compact 配额；0 回退 max_concurrent_compaction/默认。
    max_concurrent: 0

  wal:
    # sync 控制 WAL 同步落盘策略。
    sync: false
    segment_bytes: 0
    batch_records: 0
    batch_bytes: 0
    batch_interval: 0s

  query_page_cache:
    # limit: 0=默认(256)，-1=关闭。
    limit: 0
    # max_samples: 单页超过该样本数不缓存；0=默认。
    max_samples: 0

  query_block_cache:
    # limit: 0=默认(512)，-1=关闭。
    limit: 0
    # max_bytes: 0=默认 64MiB。
    max_bytes: 0

  query_protection:
    # 未显式设置 budget/limit 时的默认保护；0 表示不注入该项。
    default_max_samples: 0
    default_limit: 0

  cardinality:
    # 高基数硬限制；0 表示不限制。
    max_series: 0
    max_fields: 0
    max_tag_values_per_key: 0

  storage_memory:
    # 存储层内存预算；0 表示不限制。
    soft_sample_limit: 0
    hard_sample_limit: 0
    soft_bytes_limit: 0
    hard_bytes_limit: 0
    query_bytes_limit: 0
    flush_bytes_limit: 0
    compaction_bytes_limit: 0
    compression_bytes_limit: 0

# shutdown_timeout 控制收到 SIGINT/SIGTERM 后等待 HTTP/gRPC/Engine 优雅关闭的最长时间。
shutdown_timeout: 15s
